packages:
  - frontend
  - mobile
  - packages/*

# pnpm 12 reads settings here (not .npmrc).
strictPeerDependencies: false

# pnpm 12 blocks postinstall scripts unless listed. These are native build steps we trust.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  sharp: true

minimumReleaseAgeExclude:
  - '@expo/ui@57.0.23'
  - expo-location@57.0.21
  - expo-router@57.0.26
  - expo-splash-screen@57.0.10
  - jest-expo@57.0.6
