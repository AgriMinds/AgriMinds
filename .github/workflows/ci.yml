name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ml + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check ml backend
      - run: uv run ruff format --check ml backend
      - run: cd backend && uv run mypy
      - run: uv run pytest ml/tests backend/tests
      - name: OpenAPI schema is up to date
        run: |
          AGRIMINDS_DATA_DIR=./data uv run python -c "import json; from agriminds_api.main import create_app; from agriminds_api.core.config import Settings; json.dump(create_app(Settings(_env_file=None, data_dir='data')).openapi(), open('packages/api-types/openapi.json','w'), indent=2)"
          git diff --exit-code -- packages/api-types/openapi.json

  node:
    name: Node (web + mobile + api-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agriminds/api-types generate && git diff --exit-code -- packages/api-types/src
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @agriminds/web build

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [python, node]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build backend web
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null; then break; fi; sleep 3; done
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:8000/api/v1/drought/map?lead_month=1 | head -c 300; echo
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ >/dev/null; then break; fi; sleep 3; done
          curl -fsS -o /dev/null -w "web %{http_code}\n" http://localhost:3000/
          docker compose down -v
