[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agriminds-api"
version = "1.1.0"
description = "AgriMinds AI-DREWS REST API: drought hazard maps, cell risk, crop advisories and ENSO outlook."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ai-drews",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "redis>=5.0",
  "python-json-logger>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/agriminds_api"]

[tool.uv.sources]
ai-drews = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
ignore = ["E501", "N806"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
files = ["src/agriminds_api/domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
