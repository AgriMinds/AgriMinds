[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agriminds-api"
version = "1.1.0"
description = "AgriMinds AI-DREWS REST API: drought hazard maps, cell risk, crop advisories and ENSO outlook."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ai-drews",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "redis>=5.0",
  "python-json-logger>=3.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "email-validator>=2.2",
  "typer>=0.12",
  "httpx>=0.27",
  "msal>=1.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "aiosqlite>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/agriminds_api"]

[tool.uv.sources]
ai-drews = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
ignore = ["E501", "N806", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
files = ["src/agriminds_api/domain"]

[project.scripts]
agriminds = "agriminds_api.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests share the fixtures' loop: the database engine is session-scoped, and an
# asyncpg connection opened on one loop cannot be awaited on another.
asyncio_default_test_loop_scope = "session"
